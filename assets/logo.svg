<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Body Pain Locator — Locate pain in 3D, speak clearly to doctors and AI">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#142136"/>
      <stop offset="100%" stop-color="#0b1322"/>
    </linearGradient>

    <radialGradient id="stageGlow" cx="22%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="380" rx="22"/>
    </clipPath>

    <style>
      @keyframes fadeUp {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawLine {
        0%   { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseRing {
        0%   { transform: scale(0.85); opacity: 0.9; }
        70%  { transform: scale(1.75); opacity: 0; }
        100% { transform: scale(1.75); opacity: 0; }
      }
      @keyframes scanSweep {
        0%, 100% { transform: translateY(-48px); opacity: 0.35; }
        50%      { transform: translateY(58px); opacity: 0.85; }
      }

      .stage { animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0s backwards; }
      .mark { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.25s backwards; }
      .leader {
        stroke-dasharray: 260;
        animation: drawLine 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.75s backwards;
      }
      .title { animation: fadeUp 1.0s cubic-bezier(0.16, 1, 0.3, 1) 1.05s backwards; }
      .divider {
        stroke-dasharray: 260;
        animation: drawLine 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.55s backwards;
      }
      .tagline { animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.95s backwards; }
      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseRing 2.6s cubic-bezier(0.16, 1, 0.3, 1) 1.4s infinite;
      }
      .scanner {
        animation: scanSweep 4.8s ease-in-out 1.2s infinite;
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)" class="stage">
    <!-- 背景与柔和影棚微光 -->
    <rect width="1200" height="380" fill="url(#bgGrad)"/>
    <rect width="1200" height="380" fill="url(#stageGlow)"/>
    <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#293952" stroke-width="1.5"/>

    <!-- 细微临床坐标网格 -->
    <g stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1">
      <line x1="120" y1="0" x2="120" y2="380"/>
      <line x1="240" y1="0" x2="240" y2="380"/>
      <line x1="360" y1="0" x2="360" y2="380"/>
      <line x1="0" y1="190" x2="420" y2="190"/>
    </g>

    <!-- 左侧稳定品牌符号：抽象 3D 解剖分层轮廓 + 扫描光束 + 专业靶点折线引导线 -->
    <g class="mark" transform="translate(215, 190)">
      <!-- 外围解剖坐标环 -->
      <circle cx="0" cy="0" r="108" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="4 6"/>
      <circle cx="0" cy="0" r="82" fill="none" stroke="#38bdf8" stroke-opacity="0.34" stroke-width="1.4"/>

      <!-- 极简几何人形中轴与肩廓 -->
      <circle cx="0" cy="-54" r="15" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
      <path d="M -42 -18 C -30 -32, 30 -32, 42 -18 L 32 34 C 24 58, 12 72, 0 72 C -12 72, -24 58, -32 34 Z"
            fill="#38bdf8" fill-opacity="0.08" stroke="#cbd5e1" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- 脊柱/中轴微虚线 -->
      <line x1="0" y1="-34" x2="0" y2="66" stroke="#facc15" stroke-opacity="0.65" stroke-width="1.6" stroke-dasharray="3 4"/>

      <!-- 呼吸扫描光束 -->
      <rect class="scanner" x="-64" y="-8" width="128" height="16" rx="8" fill="url(#scanBeam)"/>

      <!-- 精准定位靶点（小针点 + 呼吸脉冲环） -->
      <circle class="pulse" cx="18" cy="-8" r="9" fill="none" stroke="#fb7185" stroke-width="2"/>
      <circle cx="18" cy="-8" r="5" fill="#0f172a" stroke="#fb7185" stroke-width="2.4"/>
      <circle cx="18" cy="-8" r="2.2" fill="#fb7185"/>

      <!-- 专业解剖图 45° 折线引导线指向品牌标题区 -->
      <polyline class="leader" points="23,-13 58,-48 165,-48" fill="none" stroke="#fb7185" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="165" cy="-48" r="3.5" fill="#fb7185"/>
    </g>

    <!-- 右侧主标题 + 错位分隔线 + 稳定 Tagline -->
    <g transform="translate(418, 0)">
      <text class="title" x="0" y="176" fill="#f8fafc"
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="56" font-weight="750" letter-spacing="-0.8">
        Body Pain Locator
      </text>

      <!-- 错位分隔线 -->
      <line class="divider" x1="0" y1="204" x2="260" y2="204" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 错位副标题（不含易过期的具体数字/清单） -->
      <g class="tagline" transform="translate(56, 246)">
        <text x="0" y="0" fill="#94a3b8"
              font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
              font-size="21" font-weight="500" letter-spacing="0.4">
          Locate discomfort in 3D · speak clearly to doctors &amp; AI
        </text>
        <text x="0" y="34" fill="#64748b"
              font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="16" font-weight="400" letter-spacing="1.2">
          立体解剖分层定位 · 让普通人把哪里疼、怎么疼一次讲清楚
        </text>
      </g>
    </g>
  </g>
</svg>
